{% extends 'base.html' %}

{% block title %}Notifications - Instagram Clone{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="card-title mb-0">Notifications</h5>
                    <button class="btn btn-sm btn-outline-primary" id="mark-all-read">Mark all as read</button>
                </div>

                <div id="notifications-list">
                    {% include 'posts/_notifications_list.html' %}
                </div>

                <div id="notifications-loading" class="text-center py-4" style="display: none;">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_css %}
<style>
.notification-item { border-bottom: 1px solid var(--border-color); padding: 12px 0; }
.notification-item:hover { background-color: var(--background-light); }
.notification-item.unread { background-color: rgba(255, 20, 147, 0.08); border-left: 3px solid var(--electric-pink); }
.notification-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
.notification-time { font-size: 0.8rem; color: var(--text-light); }
</style>
{% endblock %}

{% block extra_js %}
<script>
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie) {
        document.cookie.split(';').forEach(c => {
            c = c.trim();
            if (c.startsWith(name + '=')) cookieValue = decodeURIComponent(c.substring(name.length + 1));
        });
    }
    return cookieValue;
}

function updateNotificationBadge() {
    fetch('/api/notifications/unread-count/', { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
    .then(r => r.json())
    .then(data => {
        const badge = document.getElementById('notification-badge');
        if (!badge) return;
        if (data.count > 0) {
            badge.textContent = data.count;
            badge.style.display = 'block';
        } else {
            badge.style.display = 'none';
        }
    });
}

function bindNotificationActions() {
    document.querySelectorAll('.mark-read-btn').forEach(btn => {
        btn.onclick = () => markAsRead(btn.dataset.id, btn);
    });
    document.querySelectorAll('.accept-follow-btn').forEach(btn => {
        btn.onclick = () => handleFollowRequest(btn.dataset.requestId, 'accept', btn);
    });
    document.querySelectorAll('.reject-follow-btn').forEach(btn => {
        btn.onclick = () => handleFollowRequest(btn.dataset.requestId, 'reject', btn);
    });
}

function markAsRead(notificationId, button) {
    fetch(`/notifications/${notificationId}/mark-read/`, {
        method: 'POST',
        headers: { 'X-Requested-With': 'XMLHttpRequest', 'X-CSRFToken': getCookie('csrftoken') }
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            button.closest('.notification-item').classList.remove('unread');
            button.remove();
            updateNotificationBadge();
        }
    });
}

function handleFollowRequest(requestId, action, button) {
    fetch(`/accounts/follow-requests/${requestId}/${action}/`, {
        method: 'POST',
        headers: { 'X-Requested-With': 'XMLHttpRequest', 'X-CSRFToken': getCookie('csrftoken') }
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            button.closest('.notification-item').remove();
            updateNotificationBadge();
            loadNotifications();
        }
    });
}

function renderNotifications(notifications) {
    const list = document.getElementById('notifications-list');
    if (!notifications.length) {
        list.innerHTML = `<div class="text-center py-5 text-muted">
            <i class="bi bi-bell display-4 mb-3"></i>
            <h6>No notifications yet</h6>
        </div>`;
        return;
    }
    list.innerHTML = notifications.map(n => {
        const actions = !n.is_read ? (
            n.type === 'follow_request' ? `
                <button class="btn btn-sm btn-primary-instagram accept-follow-btn" data-request-id="${n.follow_request_id}">Accept</button>
                <button class="btn btn-sm btn-outline-secondary reject-follow-btn" data-request-id="${n.follow_request_id}">Decline</button>
            ` : `<button class="btn btn-sm btn-outline-secondary mark-read-btn" data-id="${n.id}">Mark read</button>`
        ) : '';
        const postLink = n.post_url ? ` <a href="${n.post_url}" class="small">View post</a>` : '';
        return `
            <div class="notification-item ${n.is_read ? '' : 'unread'}">
                <div class="d-flex align-items-start gap-3">
                    <a href="${n.actor_profile_url}"><img src="${n.actor_avatar}" class="notification-avatar" alt=""></a>
                    <div class="flex-grow-1">
                        <div><a href="${n.actor_profile_url}" class="fw-bold text-decoration-none text-dark">${n.actor}</a> ${n.verb}${n.target ? ' <strong>' + n.target + '</strong>' : ''}${postLink}</div>
                        <div class="notification-time">${n.time_ago}</div>
                    </div>
                    <div class="d-flex gap-1">${actions}</div>
                </div>
            </div>`;
    }).join('');
    bindNotificationActions();
}

function loadNotifications() {
    fetch('/notifications/', { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
    .then(r => r.json())
    .then(data => renderNotifications(data.notifications || []));
}

document.addEventListener('DOMContentLoaded', function() {
    bindNotificationActions();
    document.getElementById('mark-all-read').addEventListener('click', function() {
        fetch('/notifications/mark-read/', {
            method: 'POST',
            headers: { 'X-Requested-With': 'XMLHttpRequest', 'X-CSRFToken': getCookie('csrftoken') }
        }).then(() => {
            document.querySelectorAll('.notification-item').forEach(el => el.classList.remove('unread'));
            document.querySelectorAll('.mark-read-btn, .accept-follow-btn, .reject-follow-btn').forEach(el => el.remove());
            updateNotificationBadge();
        });
    });
});
</script>
{% endblock %}
